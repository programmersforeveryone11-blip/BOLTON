<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOLTON</title>
  <style>
    :root {
      --bg: #12241f;
      --panel: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.2);
      --text: #f4f7f5;
      --muted: #c9d5d1;
      --accent: #7ae0b5;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0f1f1b, #1d3531 55%, #0b1715);
      color: var(--text);
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    main {
      width: min(680px, 90vw);
      padding: 32px 28px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2.2rem, 6vw, 4rem);
      letter-spacing: 0.12em;
    }
    p {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 1rem;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    a, button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
    }
    a.primary {
      background: linear-gradient(135deg, #81e0b7, #4ecb98);
      color: #0d1b17;
      border-color: transparent;
    }
  </style>
</head>
<body>
  <main>
    <h1>BOLTON</h1>
    <p>
      La página principal ya no se redirige automáticamente. Si tienes sesión activa,
      te quedas en esta vista y puedes entrar al panel desde el botón de abajo.
    </p>
    <div class="actions">
      <a class="primary" href="stdio.html">Ir a stdio.html</a>
      <a href="index.html">Mantenerme en index.html</a>
    </div>
  </main>

  <script>
    // Corregido: no redirigir automáticamente al cargar la página.
    // La sesión activa ya no fuerza al usuario a salir de index.html.
    window.addEventListener('DOMContentLoaded', () => {
      // Aquí no se hace ninguna redirección automática.
      // Si quieres redirigir manualmente, hazlo desde un botón o una acción explícita.
    });
  </script>
</body>
</html>
